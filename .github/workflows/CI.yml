name: CI
on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:
concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.version == 'pre' }}
    timeout-minutes: 60
    permissions: # needed to allow julia-actions/cache to proactively delete old caches that it has created
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.12'
          - '1.13'
          # - 'pre'
        os:
          - ubuntu-latest
        arch:
          - x64
    env:
      LIBGL_ALWAYS_SOFTWARE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Check tested JuChrom revision
        run: julia --startup-file=no --project=. .github/scripts/check_juchrom_pin.jl
      - name: Install Linux graphics dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb xauth libgl1 libgl1-mesa-dri libglx-mesa0 mesa-utils
      - name: Check software OpenGL
        run: xvfb-run -a -s '-screen 0 1280x1024x24' glxinfo -B
      - name: Build and precompile package
        shell: xvfb-run -a -s "-screen 0 1280x1024x24" julia --color=yes --project=. {0}
        run: |
          using Pkg
          Pkg.instantiate()
          Pkg.build()
          Pkg.precompile()
      - uses: julia-actions/julia-runtest@v1
        with:
          prefix: xvfb-run -a -s '-screen 0 1280x1024x24'
          coverage: 'true'
      - name: Process coverage
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: src
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
